<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fb;
}

/* =========================
   PREMIUM NAVBAR
========================= */

.navbar{

    width:96%;
    max-width:1400px;

    height:68px;

    margin:15px auto;

    padding:0 22px;

    background:#050505;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:none;
    
}

/* =========================
   LOGO
========================= */

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    /* object-fit: cover; */
    border: 2px solid #140000;
}

.logo h2{

    color:#fff;

    font-size:20px;

    font-weight:700;

    letter-spacing:.3px;
}

.logo h2 span{
    color:#4db8ff;
}

/* =========================
   MENU
========================= */

.nav-links{

    display:flex;
    align-items:center;

    gap:8px;
}

.nav-links a{

    text-decoration:none;

    color:#fff;

    padding:10px 16px;

    border-radius:30px;

    font-size:14px;

    font-weight:500;

    transition:.3s;
}

.nav-links a:hover{

    color:#dfff57;
}

/* ACTIVE */

.nav-links a.active{

    position:relative;
}

.nav-links a.active::after{

    content:"";

    position:absolute;

    left:18%;
    bottom:4px;

    width:64%;
    height:2px;

    background:#fff;

    border-radius:10px;
}

/* LOGOUT */

.logout{

    background:#dfff57 !important;

    color:#111 !important;

    font-weight:600 !important;

    padding:10px 20px !important;
}

.logout:hover{

    transform:translateY(-2px);

    box-shadow:
    0 5px 15px rgba(223,255,87,.35);
}

/* =========================
   MOBILE BUTTON
========================= */

.menu-btn{

    display:none;

    width:40px;
    height:40px;

    border-radius:10px;

    color:#fff;

    font-size:24px;

    cursor:pointer;

    align-items:center;
    justify-content:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .navbar{

        width:95%;

        height:65px;

        padding:0 15px;

        position:relative;
    }

    .logo h2{

        font-size:13px;

        line-height:1.2;
    }

    .logo-img{

        width:38px;
        height:38px;
    }

    .menu-btn{
        display:flex;
    }

    .nav-links{

        position:absolute;

        top:75px;
        right:0;

        width:230px;

        background:#050505;

        border-radius:16px;

        padding:10px;

        flex-direction:column;

        gap:5px;

        box-shadow:
        0 10px 25px rgba(0,0,0,.18);

        opacity:0;
        visibility:hidden;

        transform:translateY(-10px);

        transition:.3s;
    }

    .nav-links.active{

        opacity:1;

        visibility:visible;

        transform:translateY(0);
    }

    .nav-links a{

        width:100%;

        text-align:left;
    }
}

</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">

    
       <img src="{{ url_for('static', filename='images/logo.png') }}" 
        alt="Logo"
        class="logo-img">

        <h2>
            TECHNOVAS
            SKILL
            FOUNDATION
        </h2>

    </div>

    <div class="menu-btn" onclick="toggleMenu()">
        ☰
    </div>

    <div class="nav-links" id="navLinks">

        <a
        href="{{ url_for('exam.student_portal') }}">

            Home

        </a>

        <a
        href="{{ url_for('showstudent_result') }}">

            Result

        </a>

        <a href="#">

            Profile

        </a>

        <a
        href="/logout"
        class="logout">

            Logout

        </a>

    </div>

</nav>


<script>

function toggleMenu()
{
    document
    .getElementById("navLinks")
    .classList
    .toggle("active");
}

document.addEventListener(
"click",
function(event)
{
    const navLinks =
    document.getElementById("navLinks");

    const menuBtn =
    document.querySelector(".menu-btn");

    if(
        !navLinks.contains(event.target)
        &&
        !menuBtn.contains(event.target)
    )
    {
        navLinks.classList.remove("active");
    }
});

</script>

</body>
</html>
