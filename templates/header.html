<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ============ TOKENS ============ */
:root{
    --ink:#0c0d13;
    --ink-2:#15161f;
    --line:rgba(255,255,255,.08);
    --text:#f2f2f0;
    --text-dim:#9b9ba8;
    --gold:#f5b942;
    --gold-ring:rgba(245,185,66,.28);
    --page:#f5f7fb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:var(--page);
}

/* =========================
   NAVBAR
========================= */

.navbar{
    width:96%;
    max-width:1400px;
    height:72px;
    margin:16px auto;
    padding:0 12px 0 12px;
    background:linear-gradient(180deg, var(--ink), #08090d);
    border:1px solid var(--line);
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.55);
    position:relative;
}

/* =========================
   BRAND / LOGO
========================= */

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
}

/* skill-badge frame around the mark: hexagon, not a plain circle */
.badge-frame{
    flex-shrink:0;
    width:70px;
    height:70px;
    clip-path:polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
    background:linear-gradient(155deg, var(--gold), #c98d1c);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2px;
    position:relative;
    overflow:hidden;
}

/* The source logo file has its own built-in padding around a smaller
   mark, so a plain 100%-cover leaves it floating with empty space.
   Oversizing + centering it here crops that padding away so the
   artwork fills the hexagon edge-to-edge. Adjust the 155% below if
   your logo file's padding is larger or smaller. */
.logo img.logo-img{
    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    height:50%;
    object-fit:cover;
    object-position:center;
    transform:translate(-50%,-50%);
    background:var(--ink);
}

.brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.15;
    min-width:0;
}

.brand-name{
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:17px;
    color:var(--text);
    letter-spacing:.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.brand-tag{
    font-size:10px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:3px;
    white-space:nowrap;
}

/* =========================
   MENU
========================= */

.nav-links{
    display:flex;
    align-items:center;
    gap:4px;
}

.nav-links a{
    text-decoration:none;
    color:var(--text-dim);
    padding:10px 18px;
    border-radius:30px;
    font-size:14px;
    font-weight:500;
    transition:.2s ease;
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
}

.nav-links a:hover{
    color:var(--text);
    background:rgba(255,255,255,.06);
}

/* ACTIVE — a lesson-tracker style dot instead of a generic underline */
.nav-links a.active{
    color:var(--text);
    background:rgba(255,255,255,.06);
}

.nav-links a.active::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 4px var(--gold-ring);
}

/* LOGOUT */

.logout{
    background:var(--gold) !important;
    color:#1a1300 !important;
    font-weight:600 !important;
    padding:10px 20px !important;
    margin-left:6px;
}

.logout:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px -4px var(--gold-ring);
}

/* =========================
   MOBILE BUTTON — animated hamburger, no JS changes needed
========================= */

.menu-btn{
    display:none;
    width:42px;
    height:42px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    cursor:pointer;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
    flex-shrink:0;
}

.menu-btn span{
    width:18px;
    height:2px;
    border-radius:2px;
    background:var(--text);
    transition:.25s ease;
}

/* When the nav panel is open, flip the icon into an X purely via CSS */
.navbar:has(#navLinks.active) .menu-btn span:nth-child(1){
    transform:translateY(7px) rotate(45deg);
}
.navbar:has(#navLinks.active) .menu-btn span:nth-child(2){
    opacity:0;
}
.navbar:has(#navLinks.active) .menu-btn span:nth-child(3){
    transform:translateY(-7px) rotate(-45deg);
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .navbar{
        width:94%;
        height:66px;
        padding:0 12px 0 16px;
    }

    .brand-name{ font-size:14px; }
    .brand-tag{ font-size:9px; }

    .badge-frame{ width:46px; height:46px; }

    .menu-btn{
        display:flex;
    }

    .nav-links{
        position:absolute;
        top:78px;
        right:0;
        width:230px;
        background:var(--ink-2);
        border:1px solid var(--line);
        border-radius:16px;
        padding:10px;
        flex-direction:column;
        align-items:stretch;
        gap:4px;
        box-shadow:0 20px 40px -18px rgba(0,0,0,.6);
        opacity:0;
        visibility:hidden;
        transform:translateY(-8px);
        transition:.25s ease;
        z-index:20;
    }

    .nav-links.active{
        opacity:1;
        visibility:visible;
        transform:translateY(0);
    }

    .nav-links a{
        width:100%;
        text-align:left;
    }

    .logout{
        margin-left:0;
        margin-top:4px;
        justify-content:center;
    }
}

@media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
}

</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">

        <div class="badge-frame">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
            alt="Logo"
            class="logo-img">
        </div>

        <div class="brand-text">
            <div class="brand-name">TECHNOVAS</div>
            <div class="brand-tag">Skill Foundation</div>
        </div>

    </div>

    <div class="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="nav-links" id="navLinks">

        <a
        href="{{ url_for('exam.student_portal') }}">

            Home

        </a>

        <a
        href="{{ url_for('showstudent_result') }}">

            Result

        </a>

        <a href="#">

            Profile

        </a>

        <a
        href="/logout"
        class="logout">

            Logout

        </a>

    </div>

</nav>


<script>

function toggleMenu()
{
    document
    .getElementById("navLinks")
    .classList
    .toggle("active");
}

document.addEventListener(
"click",
function(event)
{
    const navLinks =
    document.getElementById("navLinks");

    const menuBtn =
    document.querySelector(".menu-btn");

    if(
        !navLinks.contains(event.target)
        &&
        !menuBtn.contains(event.target)
    )
    {
        navLinks.classList.remove("active");
    }
});

</script>

</body>
</html>
