<!DOCTYPE html>
<html>
<head>

    <title>All Users</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">All Users</h2>

    <div class="table-responsive">

        <table class="table table-bordered table-striped table-hover">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Enrollment ID</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Photo</th>
                    <th>QR Code</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

                {% for user in users %}

                <tr>

                    <td>{{ user.Id }}</td>

                    <td>{{ user.Name }}</td>

                    <td>{{ user.Id }}</td>
                    

                    <td>{{ user.Email }}</td>

                    <td>{{ user.Phone }}</td>



                    <td>

                        {% if user.PhotoPath %}

                            <img src="https://www.technovas.in/Admin/AdmissionDocs/PHOTO/{{ user.PhotoPath }}"
                                 width="60"
                                 height="60"
                                 style="object-fit:cover;
                                        border-radius:50%;">

                        {% else %}

                            No Photo

                        {% endif %}

                    </td>

                     <td>
                {% if user.QRCodePath %}
                    <img src="https://www.technovas.in/Admin/QRCode/{{ user.QRCodePath }}"
                         width="80"
                         height="80">
                {% else %}
                    No QR
                {% endif %}
            </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
