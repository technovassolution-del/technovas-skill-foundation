<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Automatic Face Attendance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }

        .attendance-container {

            width: 95%;

            max-width: 900px;

            background: white;

            border-radius: 15px;

            padding: 30px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.08);

            text-align: center;

        }

        h1 {

            margin-bottom: 10px;

            color: #1f2937;

        }

        .subtitle {

            color: #6b7280;

            margin-bottom: 25px;

        }

        .camera-wrapper {

            position: relative;

            width: 100%;

            max-width: 650px;

            margin: auto;

            background: #111827;

            border-radius: 15px;

            overflow: hidden;

        }

        video {

            width: 100%;

            display: block;

        }

        .scan-overlay {

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: 260px;

            height: 320px;

            border: 3px solid #22c55e;

            border-radius: 50%;

            pointer-events: none;

        }

        .status {

            margin-top: 25px;

            padding: 15px;

            border-radius: 10px;

            background: #f3f4f6;

            color: #374151;

            font-size: 18px;

            font-weight: 600;

        }

        .status.success {

            background: #dcfce7;

            color: #166534;

        }

        .status.error {

            background: #fee2e2;

            color: #991b1b;

        }

        .status.info {

            background: #dbeafe;

            color: #1e40af;

        }

        .voice-status {

            margin-top: 15px;

            color: #6b7280;

            font-size: 14px;

        }

        .footer {

            margin-top: 20px;

            color: #9ca3af;

            font-size: 13px;

        }

    </style>

</head>

<body>

    <div class="attendance-container">

        <h1>Automatic Face Attendance</h1>

        <div class="subtitle">

            Please look at the camera. Attendance will be marked automatically.

        </div>

        <div class="camera-wrapper">

            <video id="video"
                   autoplay
                   playsinline></video>

            <div class="scan-overlay"></div>

        </div>

        <div id="attendanceStatus"
             class="status info">

            Starting camera...

        </div>

        <div id="voiceStatus"
             class="voice-status">

            🔊 Voice announcement enabled

        </div>

        <div class="footer">

            Face recognition attendance system

        </div>

    </div>


    <script>

        // --------------------------------------------------
        // GLOBAL VARIABLES
        // --------------------------------------------------

        let isScanning = false;

        let lastScanTime = 0;

        let lastRecognizedEmployee = null;

        let lastAction = null;

        let lastAnnouncementTime = 0;


        // Wait 5 seconds before another scan
        const SCAN_COOLDOWN = 5000;


        // --------------------------------------------------
        // ELEMENTS
        // --------------------------------------------------

        const video = document.getElementById(
            "video"
        );

        const attendanceStatus = document.getElementById(
            "attendanceStatus"
        );

        const voiceStatus = document.getElementById(
            "voiceStatus"
        );


        // --------------------------------------------------
        // UPDATE STATUS
        // --------------------------------------------------

        function updateStatus(
            message,
            type = "info"
        ) {

            attendanceStatus.innerText = message;

            attendanceStatus.className =
                "status " + type;

        }


        // --------------------------------------------------
        // VOICE ANNOUNCEMENT
        // --------------------------------------------------

        function speakAttendance(message) {

            if (!("speechSynthesis" in window)) {

                console.log(
                    "Speech synthesis not supported"
                );

                return;

            }

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(
                    message
                );

            speech.lang = "en-IN";

            speech.rate = 0.9;

            speech.pitch = 1;

            speech.volume = 1;

            window.speechSynthesis.speak(
                speech
            );

        }


        // --------------------------------------------------
        // START CAMERA
        // --------------------------------------------------

        async function startCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            width: {
                                ideal: 640
                            },
                            height: {
                                ideal: 480
                            },
                            facingMode: "user"
                        },

                        audio: false

                    });

                video.srcObject = stream;

                updateStatus(
                    "Camera ready. Please look at the camera.",
                    "info"
                );

            } catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                updateStatus(
                    "Unable to access camera",
                    "error"
                );

            }

        }


        // --------------------------------------------------
        // CAPTURE CURRENT FRAME
        // --------------------------------------------------

        function captureCurrentFrame() {

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width = video.videoWidth;

            canvas.height = video.videoHeight;

            const context =
                canvas.getContext("2d");

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            return canvas.toDataURL(
                "image/jpeg",
                0.85
            );

        }


        // --------------------------------------------------
        // AUTOMATIC FACE SCAN
        // --------------------------------------------------

        async function automaticFaceScan() {

            if (isScanning) {

                return;

            }

            if (!video.srcObject) {

                return;

            }

            if (video.readyState < 2) {

                return;

            }

            if (
                video.videoWidth === 0 ||
                video.videoHeight === 0
            ) {

                return;

            }

            const now = Date.now();

            if (
                now - lastScanTime < SCAN_COOLDOWN
            ) {

                return;

            }

            isScanning = true;

            try {

                updateStatus(
                    "Scanning face...",
                    "info"
                );

                const capturedPhoto =
                    captureCurrentFrame();

                const response =
                    await fetch(
                        "/employeeattendance/recognize",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                capturedPhoto:
                                    capturedPhoto

                            })

                        }
                    );

                const result =
                    await response.json();

                // ------------------------------------------
                // SUCCESS
                // ------------------------------------------

                if (result.success) {

                    const employeeName =
                        result.employee.full_name;

                    let message = "";

                    // CHECK-IN
                    if (
                        result.action === "checkin"
                    ) {

                        message =
                            `Check-in completed for ${employeeName}`;

                        updateStatus(
                            message,
                            "success"
                        );

                    }

                    // CHECK-OUT
                    else if (
                        result.action === "checkout"
                    ) {

                        message =
                            `Check-out completed for ${employeeName}`;

                        updateStatus(
                            message,
                            "success"
                        );

                    }

                    // ALREADY COMPLETED
                    else if (
                        result.action === "completed"
                    ) {

                        message =
                            `Attendance already completed for ${employeeName}`;

                        updateStatus(
                            message,
                            "info"
                        );

                    }

                    // --------------------------------------
                    // SPEAK ONLY ONCE PER ACTION
                    // --------------------------------------

                    const shouldAnnounce =
                        (
                            employeeName !==
                            lastRecognizedEmployee
                        )
                        ||
                        (
                            result.action !==
                            lastAction
                        )
                        ||
                        (
                            Date.now()
                            -
                            lastAnnouncementTime
                            >
                            30000
                        );

                    if (shouldAnnounce) {

                        speakAttendance(
                            message
                        );

                        lastRecognizedEmployee =
                            employeeName;

                        lastAction =
                            result.action;

                        lastAnnouncementTime =
                            Date.now();

                    }

                    lastScanTime = Date.now();

                }

                // ------------------------------------------
                // FACE NOT RECOGNIZED
                // ------------------------------------------

                else {

                    updateStatus(
                        "Please look at the camera.",
                        "info"
                    );

                }

            } catch (error) {

                console.error(
                    "Automatic attendance error:",
                    error
                );

                updateStatus(
                    "Unable to connect to attendance server",
                    "error"
                );

            } finally {

                isScanning = false;

            }

        }


        // --------------------------------------------------
        // START
        // --------------------------------------------------

        startCamera();


        // Scan every 1 second
        setInterval(
            automaticFaceScan,
            1000
        );

    </script>

</body>

</html>
