<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --ink:#0b1120;
    --ink-deep:#070c17;
    --paper:#f6f3ea;
    --paper-line:#e4ddc9;
    --brass:#c9932e;
    --stamp:#3457a8;
    --pass:#2f7d5a;
    --pencil:#94a3b8;
    --ink-text:#1c1a14;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* ================= BODY ================= */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:25px;

    background:
        radial-gradient(circle at 15% 10%, #142049 0%, transparent 45%),
        radial-gradient(circle at 85% 90%, #1b2a55 0%, transparent 50%),
        var(--ink);

    position:relative;

    overflow-x:hidden;
}

/* faint ruled-paper texture drifting across the whole hall */
body::after{

    content:"";

    position:fixed;

    inset:0;

    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 38px, #ffffff05 39px);

    pointer-events:none;

    z-index:-1;
}

/* ================= BACK BUTTON ================= */

.back-btn{

    position:absolute;

    top:25px;

    left:25px;

    padding:11px 22px;

    border-radius:6px;

    background:#ffffff0f;

    color:var(--pencil);

    text-decoration:none;

    font-family:'IBM Plex Mono',monospace;

    font-size:13px;

    letter-spacing:.05em;

    font-weight:500;

    border:1px solid #ffffff1f;

    transition:0.25s;

    z-index:100;
}

.back-btn:hover{

    background:var(--brass);

    color:#241a03;

    border-color:var(--brass);

    transform:translateY(-2px);
}

/* ================= MAIN CONTAINER ================= */

.container{

    width:100%;

    max-width:920px;

    min-height:520px;

    display:flex;

    background:var(--paper);

    border-radius:8px;

    overflow:hidden;

    box-shadow: 0 30px 60px -25px #000000aa, 0 0 0 1px #ffffff10;

    position:relative;
}

/* perforated top edge, echoing the exam-paper motif */
.container::before{

    content:"";

    position:absolute;

    top:-1px;

    left:24px;

    right:24px;

    height:2px;

    background-image: radial-gradient(circle, var(--ink-deep) 2px, transparent 2.2px);

    background-size: 14px 2px;

    background-repeat: repeat-x;

    z-index:2;
}

/* ================= LEFT SECTION ================= */

.left{

    flex:1;

    background:
        radial-gradient(circle at 20% 20%, #24345f 0%, transparent 55%),
        linear-gradient(160deg, var(--ink-deep), #14213f);

    color:var(--paper);

    padding:50px 46px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    position:relative;
}

.logo-wrap{

    background:#ffffff;

    border-radius:10px;

    padding:14px 18px;

    display:inline-flex;

    align-items:center;

    margin-bottom:36px;

    width:fit-content;

    box-shadow: 0 10px 30px -12px #000000aa;
}

.logo-wrap img{

    width:170px;

    display:block;
}

.eyebrow{

    font-family:'IBM Plex Mono',monospace;

    font-size:.72em;

    letter-spacing:.2em;

    text-transform:uppercase;

    color:var(--brass);

    margin-bottom:14px;
}

.left h1{

    font-family:'Fraunces',serif;

    font-weight:600;

    font-size:40px;

    margin-bottom:16px;

    line-height:1.25;
}

.left p{

    font-size:15px;

    line-height:1.8;

    color:#c7cede;
}

.left .stamp-line{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:32px;

    font-family:'IBM Plex Mono',monospace;

    font-size:.75em;

    color:var(--pencil);

    letter-spacing:.05em;
}

.left .stamp-line::before{

    content:"";

    width:34px;

    height:2px;

    background:var(--brass);
}

/* ================= RIGHT SECTION ================= */

.right{

    flex:1;

    padding:50px 48px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    background-image:
        repeating-linear-gradient(var(--paper), var(--paper) 37px, var(--paper-line) 38px);
}

.right .q-eyebrow{

    font-family:'IBM Plex Mono',monospace;

    font-size:.72em;

    letter-spacing:.18em;

    text-transform:uppercase;

    color:#8a7f5f;

    margin-bottom:8px;
}

.right h2{

    margin-bottom:8px;

    color:var(--ink-text);

    font-family:'Fraunces',serif;

    font-size:32px;

    font-weight:600;

    border-bottom:2px solid var(--ink-text);

    padding-bottom:18px;
}

.right form{

    margin-top:26px;
}

.field-label{

    font-family:'IBM Plex Mono',monospace;

    font-size:.7em;

    letter-spacing:.1em;

    text-transform:uppercase;

    color:#8a7f5f;

    margin:16px 0 6px;

    display:block;
}

/* ================= INPUT ================= */

input{

    width:100%;

    padding:14px 16px;

    border-radius:6px;

    border:1.5px solid #d9d0b3;

    outline:none;

    font-size:15px;

    font-family:'Inter',sans-serif;

    transition:0.2s;

    background:#ffffffb0;

    color:var(--ink-text);
}

input::placeholder{

    color:#a89f84;
}

input:focus{

    border-color:var(--stamp);

    background:#ffffff;

    box-shadow:0 0 0 3px #3457a81f;
}

/* ================= BUTTON ================= */

button{

    width:100%;

    padding:15px;

    margin-top:26px;

    border:none;

    border-radius:6px;

    background:var(--stamp);

    color:white;

    font-size:15px;

    font-family:'Inter',sans-serif;

    font-weight:600;

    letter-spacing:.02em;

    cursor:pointer;

    transition:0.2s;

    box-shadow: 0 12px 24px -10px #3457a870;
}

button:hover{

    filter:brightness(1.1);

    transform:translateY(-1px);
}

button:active{

    transform:translateY(0);
}

/* ================= FOOTER ================= */

.footer{

    margin-top:22px;

    font-family:'IBM Plex Mono',monospace;

    font-size:11px;

    letter-spacing:.1em;

    text-transform:uppercase;

    text-align:center;

    color:#a89f84;
}

/* ================= FOCUS VISIBILITY ================= */

a:focus-visible, button:focus-visible, input:focus-visible{

    outline:2px solid var(--brass);

    outline-offset:2px;
}

/* ================= REDUCED MOTION ================= */

@media (prefers-reduced-motion: reduce){

    *{ transition:none !important; }
}

/* ================= TABLET ================= */

@media(max-width:900px){

    .container{

        max-width:700px;

        min-height:auto;
    }

    .left,
    .right{

        padding:40px;
    }

    .left h1{

        font-size:32px;
    }

    .right h2{

        font-size:28px;
    }
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    body{

        padding:90px 18px 20px;
    }

    .container{

        flex-direction:column;

        border-radius:14px;
    }

    .left{

        padding:34px 28px;

        text-align:center;
    }

    .logo-wrap{

        margin:0 auto 26px;
    }

    .left .stamp-line{

        justify-content:center;
    }

    .right{

        padding:34px 28px;
    }

    .left h1{

        font-size:28px;
    }

    .left p{

        font-size:14px;
    }

    .right h2{

        font-size:26px;
    }

    .back-btn{

        top:18px;

        left:18px;

        font-size:12px;

        padding:10px 16px;
    }
}

/* ================= SMALL MOBILE ================= */

@media(max-width:480px){

    body{

        padding:85px 14px 14px;
    }

    .container{

        border-radius:12px;
    }

    .left,
    .right{

        padding:26px 20px;
    }

    .logo-wrap img{

        width:140px;
    }

    .left h1{

        font-size:23px;
    }

    .right h2{

        font-size:22px;
    }

    input{

        padding:13px 14px;

        font-size:14px;
    }

    button{

        padding:13px;

        font-size:14px;
    }

    .footer{

        font-size:10px;
    }

    .back-btn{

        font-size:11px;

        padding:9px 14px;
    }
}

</style>
