<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Result</title>

<style>

  :root{
    --ink:#10172e;
    --navy:#101a3b;
    --navy-deep:#0a1130;
    --gold:#d8b06a;
    --gold-soft:#f0dcae;
    --ivory:#f8f4ea;
    --success:#2f9e68;
    --muted:#a9b2cf;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--ivory);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;

    /* 🖼️ BACKGROUND PICTURE — swap the url() below for your own image */
    background-image:
      linear-gradient(180deg, rgba(10,17,48,0.88) 0%, rgba(10,17,48,0.94) 100%),
      url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }

  /* subtle scattered stars/confetti dots over the background, purely decorative */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 10% 20%, var(--gold-soft) 0, transparent 60%),
      radial-gradient(2px 2px at 80% 15%, var(--gold-soft) 0, transparent 60%),
      radial-gradient(2px 2px at 60% 80%, var(--gold-soft) 0, transparent 60%),
      radial-gradient(2px 2px at 30% 70%, var(--gold-soft) 0, transparent 60%),
      radial-gradient(2px 2px at 90% 60%, var(--gold-soft) 0, transparent 60%);
    opacity:0.5;
  }

  .card{
    position:relative;
    width:100%;
    max-width:420px;
    background:linear-gradient(165deg, var(--navy) 0%, var(--navy-deep) 100%);
    border:1px solid rgba(216,176,106,0.35);
    border-radius:18px;
    padding:48px 36px 40px;
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    animation:rise 0.6s ease-out both;
  }

  /* thin gold rule top, like a certificate border accent */
  .card::before{
    content:"";
    position:absolute;
    top:14px; left:14px; right:14px; bottom:14px;
    border:1px solid rgba(216,176,106,0.25);
    border-radius:12px;
    pointer-events:none;
  }

  .seal{
    width:72px;
    height:72px;
    margin:0 auto 22px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #a9803c 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 20px rgba(216,176,106,0.35);
    animation:pop 0.7s cubic-bezier(.34,1.56,.64,1) 0.15s both;
  }

  .seal svg{
    width:34px;
    height:34px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 10px;
    font-weight:600;
  }

  h2{
    font-family:Georgia,'Times New Roman',serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 14px;
    color:var(--ivory);
    line-height:1.3;
  }

  h2 .name{
    color:var(--gold);
  }

  p{
    font-size:15px;
    line-height:1.6;
    color:var(--muted);
    margin:0 0 32px;
  }

  .home-btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:14px 30px;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.3px;
    color:var(--navy-deep);
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    cursor:pointer;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }

  .home-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(216,176,106,0.4);
  }

  .home-btn:active{
    transform:translateY(0);
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes pop{
    0%{ opacity:0; transform:scale(0.5); }
    100%{ opacity:1; transform:scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .seal{ animation:none; }
  }

  @media (max-width:480px){
    .card{ padding:40px 24px 32px; }
    h2{ font-size:22px; }
  }

</style>

</head>

<body>

<div class="card">

  <div class="seal" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke="#10172e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <p class="eyebrow">Submission Confirmed</p>

  <h2>Congratulations, <span class="name">{{ student_name }}</span>!</h2>

  <p>Your exam has been submitted successfully. You may safely close this window or return to your portal.</p>

  <!-- 🔥 CHANGE ROUTE HERE -->
  <a href="{{ url_for('exam.student_portal') }}" style="text-decoration:none;">
    <button class="home-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 11l9-8 9 8" stroke="#10172e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 10v10h14V10" stroke="#10172e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Go To Home
    </button>
  </a>

</div>

<script>

  // 🔥 DISABLE BACK BUTTON
  history.pushState(
    null,
    null,
    location.href
  );

  window.onpopstate = function(){
    location.href =
    "{{ url_for('exam.student_portal') }}";
  };

</script>

</body>
</html>
