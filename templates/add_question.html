<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Question</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


/* BODY */

body{
    background:#f1f5f9;
    padding:20px;
}


/* CONTAINER */

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
}


/* ROW */

.row{
    display:flex;
    gap:20px;
    align-items:flex-start;
}


/* BOX */

.box{

    flex:1;

    background:#ffffff;

    padding:25px;

    border-radius:16px;

    box-shadow:0 4px 20px rgba(0,0,0,0.08);

}


/* TITLE */

h3{

    margin-bottom:20px;

    color:#0f172a;

    font-size:24px;

    font-weight:600;

}


/* LABEL */

label{

    display:block;

    margin-bottom:8px;

    color:#334155;

    font-size:14px;

    font-weight:500;

}


/* INPUTS */

input,
textarea,
select{

    width:100%;

    padding:12px 14px;

    margin-bottom:15px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    outline:none;

    font-size:15px;

    background:#ffffff;

    transition:0.3s;

}


/* FOCUS */

input:focus,
textarea:focus,
select:focus{

    border-color:#2563eb;

    box-shadow:0 0 0 3px rgba(37,99,235,0.15);

}


/* TEXTAREA */

textarea{

    min-height:120px;

    resize:vertical;

}


/* FILE UPLOAD */

.file-box{

    padding:20px;

    border:2px dashed #94a3b8;

    border-radius:12px;

    margin-bottom:15px;

    background:#f8fafc;

}


/* OPTION BOX */

.option{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:15px;

    padding:12px;

    border-radius:12px;

    background:#f8fafc;

    border:1px solid #e2e8f0;

}


.option input[type="text"]{

    flex:1;

    margin:0;

}


.option input[type="radio"]{

    width:auto;

    margin:0;

    transform:scale(1.2);

}


/* BUTTON */

button{

    width:100%;

    padding:15px;

    margin-top:25px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;

}


button:hover{

    background:#1d4ed8;

}


/* HIDE ELEMENT */

.hidden{

    display:none;

}


/* TABLET */

@media(max-width:992px){

    .row{

        flex-direction:column;

    }

}


/* MOBILE */

@media(max-width:600px){

    body{

        padding:15px;

    }


    .box{

        padding:18px;

    }


    .option{

        flex-direction:column;

        align-items:flex-start;

    }

}

</style>

</head>


<body>


<div class="container">


<form 
method="POST"
action="{{ url_for('question.save_question') }}"
enctype="multipart/form-data">


<div class="row">


<!-- LEFT BOX -->


<div class="box">


<h3>Question Details</h3>


<label>
Select Exam
</label>


<select id="examSelect" name="exam_id" required>

<option value="">
    -- Select Exam --
</option>

{% for exam in exams %}

<option 
    value="{{ exam.id }}"
    data-type="{{ exam.exam_type }}"
    {% if selected_exam_id|string == exam.id|string %}
        selected
    {% endif %}
>
    {{ exam.title }}
</option>

{% endfor %}

</select>


<!-- ONLINE QUESTION TEXT -->

<div id="questionTextBox">

<label>
Question
</label>

<textarea
    id="questionText"
    name="question_text"
    placeholder="Enter Question">
</textarea>

</div>


<!-- OFFLINE FILE UPLOAD -->

<div 
    id="fileUploadBox"
    class="file-box hidden">

<label>
Upload Question PDF / Image
</label>

<input
    type="file"
    id="questionFile"
    name="question_file"
    accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">

</div>


<!-- COMMON FOR BOTH ONLINE & OFFLINE -->

<label>
Question Type
</label>

<select 
    id="questionType"
    name="question_type">

<option value="MCQ_SINGLE">
MCQ Single
</option>

<option value="SUBJECTIVE">
Subjective
</option>

</select>


<label>
Difficulty
</label>

<select 
    name="difficulty">

<option value="EASY">
EASY
</option>

<option value="MEDIUM">
MEDIUM
</option>

<option value="HARD">
HARD
</option>

</select>


<label>
Topic
</label>

<input
    type="text"
    name="topic"
    placeholder="Enter Topic">


<label>
Explanation
</label>

<textarea
    name="explanation"
    placeholder="Enter Explanation">
</textarea>


<!-- ONLINE ONLY MARKS SECTION -->

<div id="marksSection">


<label>
Marks
</label>

<input
    type="number"
    name="marks"
    value="1"
    placeholder="Marks">


<label>
Negative Marks
</label>

<input
    type="number"
    name="negative_marks"
    value="0"
    placeholder="Negative Marks">


</div>


</div>


<!-- RIGHT BOX : ONLY ONLINE MCQ OPTIONS -->


<div 
    class="box"
    id="optionsBox">


<h3>
MCQ Options
</h3>


<!-- OPTION 1 -->

<div class="option">

<input
    type="text"
    name="option1"
    placeholder="Option 1">


<input
    type="radio"
    name="correct"
    id="correct1"
    value="1">


<label for="correct1">
Correct
</label>

</div>


<!-- OPTION 2 -->

<div class="option">

<input
    type="text"
    name="option2"
    placeholder="Option 2">


<input
    type="radio"
    name="correct"
    id="correct2"
    value="2">


<label for="correct2">
Correct
</label>

</div>


<!-- OPTION 3 -->

<div class="option">

<input
    type="text"
    name="option3"
    placeholder="Option 3">


<input
    type="radio"
    name="correct"
    id="correct3"
    value="3">


<label for="correct3">
Correct
</label>

</div>


<!-- OPTION 4 -->

<div class="option">

<input
    type="text"
    name="option4"
    placeholder="Option 4">


<input
    type="radio"
    name="correct"
    id="correct4"
    value="4">


<label for="correct4">
Correct
</label>

</div>


</div>


</div>


<!-- SUBMIT BUTTON -->


<button type="submit">

Save Question

</button>

</form>

</div>



<script>

// ===============================
// Get Elements
// ===============================

const examSelect = document.getElementById("examSelect");
const questionBox = document.getElementById("questionTextBox");
const fileBox = document.getElementById("fileUploadBox");
const optionsBox = document.getElementById("optionsBox");
const questionType = document.getElementById("questionType");
const marksSection = document.getElementById("marksSection");
const questionText = document.getElementById("questionText");
const questionFile = document.getElementById("questionFile");


// ===============================
// Change Interface By Exam Type
// ===============================

function changeExamType() {

    const selected = examSelect.options[examSelect.selectedIndex];

    if (!selected) {
        return;
    }

    const examType = selected.getAttribute("data-type");


    // ===========================
    // OFFLINE EXAM
    // ===========================

    if (examType === "offline") {

        // Hide Question Text
        questionBox.classList.add("hidden");

        // Show PDF/Image Upload
        fileBox.classList.remove("hidden");

        // Hide MCQ Options
        optionsBox.classList.add("hidden");

        // Hide Marks
        marksSection.classList.add("hidden");


        // Validation
        questionText.removeAttribute("required");
        questionFile.setAttribute("required", true);


        // Remove option required
        document.querySelectorAll("#optionsBox input[type='text']")
        .forEach(function(input) {
            input.removeAttribute("required");
        });

    }


    // ===========================
    // ONLINE EXAM
    // ===========================

    else {

        // Show Question Text
        questionBox.classList.remove("hidden");

        // Hide File Upload
        fileBox.classList.add("hidden");

        // Show Marks
        marksSection.classList.remove("hidden");


        // Validation
        questionText.setAttribute("required", true);
        questionFile.removeAttribute("required");


        // Check MCQ or Subjective
        changeQuestionType();

    }

}



// ===============================
// Change By Question Type
// ===============================

function changeQuestionType() {


    const selected = examSelect.options[examSelect.selectedIndex];

    const examType = selected.getAttribute("data-type");


    // Offline Exam always hides options
    if (examType === "offline") {

        optionsBox.classList.add("hidden");

        return;

    }


    // Online Subjective
    if (questionType.value === "SUBJECTIVE") {


        // Hide Options
        optionsBox.classList.add("hidden");


        // Remove Required
        document.querySelectorAll("#optionsBox input[type='text']")
        .forEach(function(input) {
            input.removeAttribute("required");
        });


    }


    // Online MCQ
    else {


        // Show Options
        optionsBox.classList.remove("hidden");


        // Add Required
        document.querySelectorAll("#optionsBox input[type='text']")
        .forEach(function(input) {
            input.setAttribute("required", true);
        });


    }

}


// ===============================
// Event Listeners
// ===============================

examSelect.addEventListener(
    "change",
    changeExamType
);


questionType.addEventListener(
    "change",
    changeQuestionType
);


// ===============================
// Default Page Load
// ===============================

window.onload = function () {

    changeExamType();

};


</script>


</body>

</html>
