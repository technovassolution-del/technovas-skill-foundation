<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>

    <style>
        .attendance-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .day-box {
            width: 100px;
            height: 100px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .present {
            background-color: #d4edda;
        }

        .absent {
            background-color: #f8d7da;
        }

        .day-number {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            margin-top: 8px;
            font-weight: bold;
        }

        .time {
            font-size: 11px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h2>Attendance - {{ month }}/{{ year }}</h2>

    <div class="attendance-container">

        {% for day in range(1, total_days + 1) %}

            {% if day in attendance_data %}

                <div class="day-box present">
                    <div class="day-number">{{ day }}</div>

                    <div class="status">
                        P
                    </div>

                    <div class="time">
                        In: {{ attendance_data[day].in_time }}
                    </div>

                    <div class="time">
                        Out: {{ attendance_data[day].out_time }}
                    </div>
                </div>

            {% else %}

                <div class="day-box absent">
                    <div class="day-number">{{ day }}</div>

                    <div class="status">
                        A
                    </div>
                </div>

            {% endif %}

        {% endfor %}

    </div>

</body>
</html>
