<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Exam</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BACKGROUND */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e1b4b,#312e81,#1e293b);
    padding:20px;
}

/* MAIN WRAPPER */
.wrapper{
    width:100%;
    max-width:1000px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
}

/* LEFT PANEL */
.left{
    flex:1;
    background:
    linear-gradient(rgba(79,70,229,0.6), rgba(30,27,75,0.85)),
    url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');
    background-size:cover;
    background-position:center;
    padding:30px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.left .top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.left h3{
    font-size:18px;
}

.back{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.2);
    padding:8px 14px;
    border-radius:20px;
    transition:0.3s;
}

.back:hover{
    background:white;
    color:#1e1b4b;
}

.left h2{
    font-size:22px;
    line-height:1.4;
}

/* RIGHT PANEL */
.right{
    flex:1;
    padding:35px;
    color:white;
}

/* INPUT STYLE */
input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.08);
    color:white;
    outline:none;
    font-size:14px;
}

select option{
    color:black;
}

input::placeholder,
textarea::placeholder{
    color:#cbd5f5;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.row{
    display:flex;
    gap:10px;
}

.row input{
    flex:1;
}

/* Online Options */
.checkbox-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.checkbox-group label{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.08);
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.checkbox-group input{
    width:auto;
    margin:0;
}

/* Button */
.btn{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(99,102,241,0.5);
}

/* Responsive */
@media(max-width:900px){
    .wrapper{
        flex-direction:column;
    }
}

@media(max-width:600px){

    .right{
        padding:20px;
    }

    .row{
        flex-direction:column;
    }

    .checkbox-group{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT PANEL -->
<div class="left">

    <div class="top">
        <h3>Exam Panel</h3>

        <a href="#" class="back">
            ← Dashboard
        </a>
    </div>

    <h2>
        Create powerful exams with ease 🚀
    </h2>

</div>


<!-- RIGHT PANEL -->
<div class="right">

<h2>Create Exam</h2>

<form method="POST" action="/save_exam">

    <!-- Exam Type -->
    <div class="row">

        <select id="examType" name="exam_type" required>

            <option value="online" selected>
                Online Exam
            </option>

            <option value="offline">
                Offline Exam
            </option>

        </select>

    </div>

    <!-- Title -->
    <input 
        type="text"
        name="title"
        placeholder="Exam Title"
        required>

    <!-- Description -->
    <textarea
        name="description"
        placeholder="Description">
    </textarea>

    <!-- Date Time -->
    <div class="row">

        <input 
            type="datetime-local"
            name="start_date"
            required>

        <input 
            type="datetime-local"
            name="end_date"
            required>

    </div>

    <!-- Duration -->
    <input 
        type="number"
        name="duration"
        placeholder="Duration (minutes)"
        required>

    <!-- Marks -->
    <div class="row">

        <input 
            type="number"
            name="total_marks"
            placeholder="Total Marks"
            required>

        <input 
            type="number"
            name="pass_marks"
            placeholder="Pass Marks"
            required>

    </div>

    <!-- ONLINE OPTIONS -->
    <div class="checkbox-group" id="onlineOptions">

        <label>
            <input type="checkbox" name="shuffle_questions">
            Shuffle Questions
        </label>

        <label>
            <input type="checkbox" name="shuffle_options">
            Shuffle Options
        </label>

        <label>
            <input type="checkbox" name="allow_review" checked>
            Allow Review
        </label>

    </div>

    <!-- 🔥 PUBLISH CONTROL (IMPORTANT FIX) -->
    <div class="checkbox-group">

        <label>
            <input type="checkbox" name="publish" value="1" checked>
            Publish Exam 
        </label>

    </div>

    <!-- SUBMIT -->
    <button class="btn" type="submit">
        Create Exam
    </button>

</form>

</div>

</div>


<script>

// Get Elements
const examType = document.getElementById("examType");
const onlineOptions = document.getElementById("onlineOptions");


// Change Mode
function changeExamMode(){

    if(examType.value === "offline"){

        // Hide Online Features
        onlineOptions.style.display = "none";

    } 
    else {

        // Show Online Features
        onlineOptions.style.display = "grid";

    }

}


// Run when dropdown changes
examType.addEventListener(
    "change",
    changeExamMode
);


// Default page load
changeExamMode();


</script>


</body>
</html>
