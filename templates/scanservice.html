<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Paper Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input[type=file] {
            width: 100%;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #preview {
            width: 100%;
            margin-top: 15px;
            display: none;
            border-radius: 5px;
        }

        #status {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload Handwritten Paper</h2>

    <form id="uploadForm">
        <input
            type="file"
            id="image"
            name="image"
            accept="image/*"
            capture="environment"
            required
        >

        <img id="preview">

        <button type="submit">Upload</button>
    </form>

    <p id="status"></p>
</div>

<script>
const imageInput = document.getElementById('image');
const preview = document.getElementById('preview');

let compressedFile = null;

imageInput.addEventListener('change', async function () {
    const file = this.files[0];
    if (!file) return;

    // Preview original image
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';

    // Compress image
    compressedFile = await compressImage(file, 800, 0.7); // max width 800px, quality 70%
});

async function compressImage(file, maxWidth, quality) {
    return new Promise((resolve) => {
        const img = new Image();

        img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
                height = (height * maxWidth) / width;
                width = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
                (blob) => {
                    resolve(
                        new File(
                            [blob],
                            file.name.replace(/\.\w+$/, '.jpg'),
                            { type: 'image/jpeg' }
                        )
                    );
                },
                'image/jpeg',
                quality
            );
        };

        img.src = URL.createObjectURL(file);
    });
}

document.getElementById('uploadForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    if (!compressedFile) {
        document.getElementById('status').innerText = "Please select an image";
        return;
    }

    const formData = new FormData();
    formData.append('image', compressedFile);

    document.getElementById('status').innerText = "Uploading...";

    try {
        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });

        const text = await response.text();

        document.getElementById('status').innerText =
            text || "Upload successful";
    } catch (error) {
        console.error("Error uploading image:", error);
        document.getElementById('status').innerText =
            error.message || "Upload failed";
    }
});
</script>

</body>
</html>
